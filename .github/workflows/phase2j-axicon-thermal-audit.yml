name: Phase 2J axicon thermal visual audit

on:
  workflow_dispatch:
  push:
    branches:
      - phase2j-presentation-visual-standardisation
    paths:
      - '.github/workflows/phase2j-axicon-thermal-audit.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  render-axicon-decentre-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Render only corrected axicon-decentre figure
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import build_phase2j_presentation_suite as suite
          import build_phase2i_presentation_figures as core
          import presentation_phase2j_style as style
          style.validate_palette_has_no_cool_segment()
          suite._patch_core_renderer()
          out = Path('phase2j_axicon_audit')
          out.mkdir(exist_ok=True)
          p, metrics = core.build_v1_decentre(out, 2048)
          p = suite._rename(p, '04_V1_axicon_decentre_fixed_lab_thermal_tight.png')
          print(p)
          print(metrics)
          PY
      - name: Upload exact axicon visual audit
        uses: actions/upload-artifact@v4
        with:
          name: phase2j-axicon-thermal-audit
          path: phase2j_axicon_audit/04_V1_axicon_decentre_fixed_lab_thermal_tight.png
          if-no-files-found: error
