name: Vortex fringing nominal correction

on:
  pull_request:
    branches:
      - phase2e-vortex-system-errors
    paths:
      - 'fringing_run_trigger.txt'

permissions:
  contents: read

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  corrected_fringing:
    name: Corrected fringing ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        case: [B0, V1, V3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run corrected fringing families
        run: |
          python tools/run_vortex_system_error_suite_default_nominal.py \
            --cases '${{ matrix.case }}' \
            --families slm_fringing_sigma_x slm_fringing_sigma_y slm1_fringing_sigma_x slm2_fringing_sigma_x \
            --grid-n 1536 \
            --z-mm 60 \
            --output-root 'outputs/validation/fringing_corrected/${{ matrix.case }}' \
            --figure-root 'outputs/figures/fringing_corrected/${{ matrix.case }}'
      - name: Verify zero is nominal
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path('outputs/validation/fringing_corrected/${{ matrix.case }}/system_error_metrics.csv')
          df = pd.read_csv(p)
          bad = df.loc[~df['nominal_value'].fillna(999).eq(0.0), ['family','value','nominal_value']]
          if not bad.empty:
              raise SystemExit('nonzero fringing nominal detected:\n' + bad.to_string(index=False))
          print('All fringing families use zero sigma as nominal.')
          PY
      - name: Audit corrected signatures
        run: |
          python tools/audit_vortex_system_error_signatures.py \
            --metrics 'outputs/validation/fringing_corrected/${{ matrix.case }}/system_error_metrics.csv' \
            --output 'outputs/validation/fringing_corrected/${{ matrix.case }}/system_error_signature_audit.json'
      - name: Upload corrected fringing outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-fringing-${{ matrix.case }}
          path: |
            outputs/validation/fringing_corrected/${{ matrix.case }}
            outputs/figures/fringing_corrected/${{ matrix.case }}
          if-no-files-found: warn
          retention-days: 14
