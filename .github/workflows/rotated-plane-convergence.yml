name: Rotated-plane actual-field convergence

on:
  pull_request:
    branches:
      - phase2e-vortex-system-errors
    paths:
      - 'rotated_plane_run_trigger.txt'

permissions:
  contents: read

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Run V1 N1536 actual-field convergence
        run: python tools/check_rotated_plane_actual_fields.py --grid-n 1536 --case V1 --output outputs/validation/rotated_plane_actual_fields.json
      - name: Run V1 carrier-centred convergence
        run: python tools/check_rotated_plane_carrier_centering.py --grid-n 1536 --case V1 --output outputs/validation/rotated_plane_carrier_centering.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotated-plane-convergence
          path: |
            outputs/validation/rotated_plane_actual_fields.json
            outputs/validation/rotated_plane_carrier_centering.json
          retention-days: 14
