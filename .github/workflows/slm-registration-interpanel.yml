name: Conditional 200 mm inter SLM registration evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/slm-registration-interpanel.yml'
      - 'vbb_study/digital_twin/registration_interpanel.py'
      - 'tools/*registration_interpanel*'
      - 'tests/test_registration_interpanel.py'
      - 'docs/101_slm_registration_interpanel_propagation.md'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy pandas matplotlib pytest python-docx
      - run: sudo apt-get update && sudo apt-get install -y pandoc libreoffice-writer
      - name: Registration physics gates
        run: python -m pytest -q tests/test_slm_pixel_registration.py tests/test_slm_registration_architectures.py tests/test_registration_reference.py tests/test_registration_interpanel.py
      - name: Sequential staged simulations and convergence
        run: |
          python -m tools.run_registration_interpanel_study --stage sweep
          python -m tools.run_registration_interpanel_study --stage controls
          python -m tools.run_registration_interpanel_study --stage postcontrols
          python -m tools.run_registration_interpanel_study --stage extra
      - name: Scientific figures and editable report
        run: |
          python -m tools.plot_registration_interpanel_study --data outputs/validation/registration_interpanel_200mm --output outputs/validation/registration_interpanel_200mm/figures
          python -m tools.build_registration_interpanel_report --data outputs/validation/registration_interpanel_200mm --output outputs/reports/registration_interpanel
          libreoffice -env:UserInstallation=file:///tmp/interpanel-lo --headless --convert-to pdf --outdir outputs/reports/registration_interpanel outputs/reports/registration_interpanel/SLM_Registration_200mm_Report.docx
      - uses: actions/upload-artifact@v4
        with:
          name: registration-200mm-conditional-evidence
          path: |
            outputs/validation/registration_interpanel_200mm
            outputs/reports/registration_interpanel
          if-no-files-found: error
          compression-level: 6
