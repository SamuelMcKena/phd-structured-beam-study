name: Registration input beam scale audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/slm-registration-beam-scale.yml'
      - 'tools/audit_registration_beam_scale.py'
      - 'tools/revise_registration_summary_scale.py'
      - 'tests/test_registration_beam_scale.py'
      - 'docs/102_registration_beam_size_and_ring_scale.md'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MPLBACKEND: Agg
jobs:
  scale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 matplotlib==3.10.8 pytest
      - run: python -m pytest tests/test_registration_beam_scale.py tests/test_registration_interpanel.py -q
