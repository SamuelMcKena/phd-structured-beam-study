name: Phase 2G bench-calibrated digital twin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vbb_study/calibration/**'
      - 'vbb_study/digital_twin/bench_calibrated_route.py'
      - 'vbb_study/digital_twin/objective_sample_route.py'
      - 'vbb_study/digital_twin/objective_pupil_mapping.py'
      - 'vbb_study/digital_twin/ultrafast_exposure.py'
      - 'vbb_study/digital_twin/calibrated_material_response.py'
      - 'vbb_study/vector_arm_config.py'
      - 'vbb_study/vbb_vector.py'
      - 'vbb_study/digital_twin/nathan_vector_hexagon.py'
      - 'tests/test_phase2g_bench_calibrated_digital_twin.py'
      - 'tests/test_phase2g_objective_pupil_mapping.py'
      - 'tests/test_phase2g_vector_observables.py'
      - 'tools/build_phase2g_bench_readiness.py'
      - '.github/workflows/phase2g-bench-calibrated-digital-twin.yml'

concurrency:
  group: phase2g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  phase2g-unit-and-regression:
    name: Phase 2G physics / calibration gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Phase 2G focused tests
        run: >-
          python -m pytest -q
          tests/test_phase2g_bench_calibrated_digital_twin.py
          tests/test_phase2g_objective_pupil_mapping.py
          tests/test_phase2g_vector_observables.py
      - name: Preserve clean-checkout Phase 2D numerical/calibration contracts
        run: >-
          python -m pytest -q tests/test_phase2d_calibration_bridge.py
          -k 'not uncertainty_seed_is_deterministic
          and not zero_input_uncertainty_propagates_zero
          and not uncertainty_intervals_contain_nominal
          and not synthetic_bundle_is_visibly_marked
          and not synthetic_bundle_cannot_claim_real_calibration_maturity
          and not h1_edge_uncertainty_is_not_invented'
      - name: Explain excluded Phase 2D artifact-dependent checks
        run: >-
          echo 'Six Phase 2D tests require the ignored/generated
          outputs/validation/phase2d/synthetic_bundles/full_synthetic_validation.json artifact.
          Those freeze-environment artifact-presence tests are intentionally not treated as
          clean-checkout physics regressions; the remaining Phase 2D tests are executed above.'
      - name: Preserve refractive axicon reference gates
        run: >-
          python -m pytest -q
          tests/test_vortex_refractive_axicon.py
          tests/test_vortex_refractive_axicon_wave.py
      - name: Compile changed physics modules
        run: >-
          python -m compileall -q
          vbb_study/calibration
          vbb_study/digital_twin/bench_calibrated_route.py
          vbb_study/digital_twin/objective_sample_route.py
          vbb_study/digital_twin/objective_pupil_mapping.py
          vbb_study/digital_twin/ultrafast_exposure.py
          vbb_study/digital_twin/calibrated_material_response.py
          tools/build_phase2g_bench_readiness.py
      - name: Build calibration readiness evidence
        run: python tools/build_phase2g_bench_readiness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2g-bench-readiness
          path: |
            outputs/validation/phase2g/bench_readiness.json
            calibration/templates/phase2g_bench_calibration_template.json
          retention-days: 30

  objective-interface-regression:
    name: Phase 2C objective/interface numerical regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Existing Phase 2C numerical/vector/interface tests
        run: >-
          python -m pytest -q tests/test_phase2c_objective_interface.py
          -k 'not figure_manifest_reuses_phase2b_and_keeps_metrics_native
          and not h1_3d_outputs_are_pure_fixed_plane_intensity_surfaces'
      - name: Explain excluded Phase 2C artifact-dependent checks
        run: >-
          echo 'Two Phase 2C checks validate the physical presence of generated PNGs referenced
          by the frozen figure manifest. The ignored figure tree is not part of a clean Actions checkout;
          all Phase 2C numerical/vector/interface tests are executed above.'
