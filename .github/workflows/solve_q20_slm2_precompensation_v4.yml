name: Solve q20 SLM2 precompensation v4

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/solve_q20_slm2_precompensation_v4.py'
      - '.github/workflows/solve_q20_slm2_precompensation_v4.yml'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_aware_model_v3_candidate.json'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/solve_q20_slm2_precompensation_v4.py
          pytest -q tests/test_detector_response.py tests/test_vortex_explicit_system_extensions.py
      - name: Solve compact SLM2 map and topology-regularise
        run: |
          python tools/solve_q20_slm2_precompensation_v4.py
      - name: Upload correction evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-slm2-precompensation-v4
          path: outputs/validation/q20_slm2_precompensation_v4/
          if-no-files-found: error
