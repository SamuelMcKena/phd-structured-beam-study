name: Cross-check q20 Miao initializer

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/crosscheck_q20_miao_initializer.py'
      - '.github/workflows/crosscheck_q20_miao_initializer.yml'
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/fit_q20_detector_aware_model_v2.py tools/fit_q20_detector_aware_model_v3.py tools/benchmark_q20_miao_bessel_modal.py tools/crosscheck_q20_miao_initializer.py
          pytest -q tests/test_detector_response.py tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Build detector-aware source used by Miao benchmark
        run: python tools/fit_q20_detector_aware_model_v2.py
      - name: Run independent Miao-style modal retrieval
        run: python tools/benchmark_q20_miao_bessel_modal.py
      - name: Test Miao retrieval as full-route initializer
        run: python tools/crosscheck_q20_miao_initializer.py
      - name: Upload cross-check evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-miao-initializer-crosscheck
          path: outputs/validation/q20_miao_initializer_crosscheck/
          if-no-files-found: error
