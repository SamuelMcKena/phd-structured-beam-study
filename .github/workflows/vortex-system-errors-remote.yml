name: Vortex system-error remote run

on:
  pull_request:
    branches:
      - phase2e-vortex-system-errors
    paths:
      - 'remote_run_trigger.txt'
      - '.github/workflows/vortex-system-errors-remote.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .
  MPLBACKEND: Agg

concurrency:
  group: vortex-system-errors-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: Repaired physics gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Focused tests
        run: |
          python -m pytest \
            tests/test_phase2e_source_sampling_repair.py \
            tests/test_phase2e_production_repair.py \
            tests/test_vortex_error_reference_models.py \
            tests/test_vortex_round_tip_reference.py \
            tests/test_vortex_physical_errors.py \
            tests/test_vortex_visual_atlas.py \
            tests/test_vortex_system_errors.py \
            tests/test_vortex_explicit_system_extensions.py \
            tests/test_vortex_rotated_plane_carrier.py \
            -q
      - name: Compile repaired modules
        run: |
          python -m compileall -q \
            vbb_study/digital_twin/vortex_beam_slm_errors.py \
            vbb_study/digital_twin/vortex_explicit_4f.py \
            vbb_study/digital_twin/vortex_rotated_plane.py \
            vbb_study/digital_twin/vortex_system_route.py \
            vbb_study/digital_twin/vortex_system_error_sweeps.py \
            tools/check_vortex_explicit_4f_parity.py \
            tools/run_vortex_system_error_suite.py \
            tools/audit_vortex_system_error_signatures.py
      - name: Analytic reference checks
        run: python tools/check_vortex_error_reference_models.py
      - name: Explicit 4F parity N512
        run: python tools/check_vortex_explicit_4f_parity.py --grid-n 512 --cases B0 V1 V3
      - name: Explicit 4F parity N1536
        run: python tools/check_vortex_explicit_4f_parity.py --grid-n 1536 --cases B0 V1 V3

  physical:
    name: Physical ${{ matrix.case }} / ${{ matrix.group.name }}
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: false
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    strategy:
      fail-fast: false
      matrix:
        case: [B0, V1, V3]
        group:
          - name: beam
            families: 'beam_lateral_decentre_x beam_lateral_decentre_y beam_radius_scale beam_ellipticity beam_curvature_common beam_curvature_x beam_curvature_y'
          - name: slm_registration_stroke
            families: 'slm1_hologram_offset_x slm1_hologram_offset_y slm2_carrier_rotation slm2_carrier_scale_x slm_phase_stroke slm1_phase_stroke slm2_phase_stroke'
          - name: slm_fringing
            families: 'slm_fringing_sigma_x slm_fringing_sigma_y slm1_fringing_sigma_x slm2_fringing_sigma_x'
          - name: fourf_core
            families: 'fourf_iris_offset_x fourf_iris_offset_y fourf_iris_radius_scale fourf_lens1_despace fourf_lens2_despace fourf_lens1_focal_scale fourf_lens2_focal_scale'
          - name: fourf_alignment
            families: 'fourf_lens1_decentre_x fourf_lens1_decentre_y fourf_lens2_decentre_x fourf_lens2_decentre_y fourf_lens1_tilt_x fourf_lens1_tilt_y fourf_lens2_tilt_x fourf_lens2_tilt_y'
          - name: axicon
            families: 'axicon_lateral_decentre_x axicon_lateral_decentre_y axicon_rigid_tilt_x axicon_rigid_tilt_y axicon_round_tip axicon_flat_tip axicon_base_angle_scale axicon_index_scale'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run physical family group
        shell: bash
        run: |
          python tools/run_vortex_system_error_suite.py \
            --cases '${{ matrix.case }}' \
            --families ${{ matrix.group.families }} \
            --grid-n 1536 \
            --z-mm 60 \
            --output-root 'outputs/validation/remote/${{ matrix.case }}/${{ matrix.group.name }}' \
            --figure-root 'outputs/figures/remote/${{ matrix.case }}/${{ matrix.group.name }}'
      - name: Audit available signatures
        run: |
          python tools/audit_vortex_system_error_signatures.py \
            --metrics 'outputs/validation/remote/${{ matrix.case }}/${{ matrix.group.name }}/system_error_metrics.csv' \
            --output 'outputs/validation/remote/${{ matrix.case }}/${{ matrix.group.name }}/system_error_signature_audit.json'
      - name: Upload physical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-${{ matrix.case }}-${{ matrix.group.name }}
          path: |
            outputs/validation/remote/${{ matrix.case }}/${{ matrix.group.name }}
            outputs/figures/remote/${{ matrix.case }}/${{ matrix.group.name }}
          if-no-files-found: warn
          retention-days: 14

  declared_aberrations:
    name: Declared aberrations ${{ matrix.case }}
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    strategy:
      fail-fast: false
      matrix:
        case: [B0, V1, V3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run declared-aberration suite
        run: |
          python tools/run_vortex_declared_aberration_suite.py \
            --cases '${{ matrix.case }}' \
            --grid-n 1536 \
            --z-mm 60 \
            --output-root 'outputs/validation/remote_declared/${{ matrix.case }}'
      - name: Upload declared-aberration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declared-aberrations-${{ matrix.case }}
          path: outputs/validation/remote_declared/${{ matrix.case }}
          if-no-files-found: warn
          retention-days: 14
