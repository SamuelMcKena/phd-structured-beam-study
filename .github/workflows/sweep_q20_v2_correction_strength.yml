name: Sweep q20 v2 correction strength

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/sweep_q20_v2_correction_strength.py'
      - '.github/workflows/sweep_q20_v2_correction_strength.yml'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_aware_axicon_residual_candidate.json'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_domain_slm2_v2_candidate.json'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/sweep_q20_v2_correction_strength.py
          pytest -q tests/test_detector_response.py tests/test_vortex_explicit_system_extensions.py
      - name: Sweep topology-preserving correction strength and validate winner at 4096
        run: |
          python tools/sweep_q20_v2_correction_strength.py
      - name: Upload topology-regularised evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-v2-topology-regularised-4096
          path: outputs/validation/q20_v2_strength_sweep/
          if-no-files-found: error
