name: Fit q20 detector-aware residual

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/fit_q20_detector_aware_residual.py'
      - 'vbb_study/digital_twin/detector_response.py'
      - 'tests/test_detector_response.py'
      - 'vbb_study/digital_twin/observation_frame.py'
      - 'vbb_study/digital_twin/residual_phase_fit.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - '.github/workflows/fit_q20_detector_aware_residual.yml'
  workflow_dispatch:

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/fit_q20_detector_aware_residual.py
          pytest -q tests/test_detector_response.py tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Fit detector-aware residual on real BMG-derived arrays
        run: |
          python tools/fit_q20_detector_aware_residual.py
      - name: Upload detector-aware evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-detector-aware-residual
          path: outputs/validation/q20_detector_aware_residual/
          if-no-files-found: error
