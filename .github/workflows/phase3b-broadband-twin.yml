name: Phase 3B bench-calibrated broadband twin

on:
  push:
    branches:
      - phase3b-bench-calibrated-broadband-twin
    paths:
      - "vbb_study/equations/dispersion.py"
      - "vbb_study/equations/calibrated_objective.py"
      - "vbb_study/equations/vector_surface_refraction.py"
      - "vbb_study/equations/__init__.py"
      - "vbb_study/digital_twin/broadband_propagation.py"
      - "vbb_study/digital_twin/phase3b_bench_broadband.py"
      - "vbb_study/calibration/detector_transfer.py"
      - "vbb_study/calibration/full_field_uncertainty.py"
      - "vbb_study/calibration/phase3b_experiment_comparison.py"
      - "vbb_study/calibration/__init__.py"
      - "tests/test_phase3b_*.py"
      - "docs/phase3b/**"
      - "docs/04_model_limitations.md"
      - "config/phase3b_bench_calibrated.example.json"
      - ".github/workflows/phase3b-broadband-twin.yml"
  workflow_dispatch:

jobs:
  phase3b-regression:
    name: Python 3.13 Phase 3B physics and calibration regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install repository test dependencies
        run: python -m pip install -r requirements-report.txt
      - name: Compile Phase 3B and dependent packages
        run: python -m compileall -q vbb_study tests
      - name: Check Phase 3B branch diff whitespace
        run: git diff --check origin/phase3-zemax-cross-validation...HEAD
      - name: Run Phase 3B regression tests
        run: python -m pytest tests/test_phase3b_*.py -q
      - name: Re-run clean-room Phase 2H vector axicon regressions
        run: >-
          python -m pytest
          tests/test_phase2h_vector_refractive_axicon.py
          tests/test_phase2h_vector_refractive_reference.py
          tests/test_phase2h_calibrated_vector_tilt_route.py
          tests/test_phase2h_vector_tilt_study.py
          -q
      - name: Explain excluded historical artifact tests
        run: >-
          echo "Phase 2C/2D report-artifact tests are intentionally not run here:
          they require generated/frozen output bundles and Windows-style manifest paths
          that are not present on a clean Ubuntu checkout. Phase 3B does not modify
          those frozen artifacts or tests."
