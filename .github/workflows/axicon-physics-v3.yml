name: Axicon physics v3 continuous propagation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vbb_study/digital_twin/vortex_continuous_propagation.py'
      - 'tools/run_vortex_axicon_physics_suite_v3.py'
      - 'tools/check_axicon_continuous_propagation_benchmark.py'
      - 'tests/test_vortex_continuous_propagation.py'
      - '.github/workflows/axicon-physics-v3.yml'

concurrency:
  group: axicon-physics-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  propagation-gates:
    name: Continuous propagation gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fixed-support propagation unit tests
        run: python -m pytest -q tests/test_vortex_continuous_propagation.py
      - name: Padded-ASM propagation benchmark
        run: >-
          python tools/check_axicon_continuous_propagation_benchmark.py
          --grid-n 768
          --output outputs/validation/axicon_continuous_propagation_benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axicon-v3-propagation-gates
          path: outputs/validation/axicon_continuous_propagation_benchmark.json
          retention-days: 14

  physical:
    name: Axicon v3 ${{ matrix.case }} / ${{ matrix.group }}
    needs: propagation-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [B0, V1, V3]
        group: [alignment, tip, material]
        include:
          - group: alignment
            families: axicon_lateral_decentre_x axicon_lateral_decentre_y
          - group: tip
            families: axicon_round_tip_radius axicon_flat_tip_radius
          - group: material
            families: axicon_base_angle_scale axicon_index_scale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run N1536 fixed-plane figures and linear profiles
        shell: bash
        run: >-
          python tools/run_vortex_axicon_physics_suite_v3.py
          --cases '${{ matrix.case }}'
          --families ${{ matrix.families }}
          --grid-n 1536
          --z-mm 60
          --output-root 'outputs/validation/axicon_v3/${{ matrix.case }}/${{ matrix.group }}'
          --figure-root 'outputs/figures/axicon_v3/${{ matrix.case }}/${{ matrix.group }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axicon-v3-${{ matrix.case }}-${{ matrix.group }}
          path: |
            outputs/validation/axicon_v3/${{ matrix.case }}/${{ matrix.group }}
            outputs/figures/axicon_v3/${{ matrix.case }}/${{ matrix.group }}
          retention-days: 14
