name: Fit q20 beam-frame residual v1

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/fit_q20_beam_frame_residual_v1.py'
      - 'vbb_study/digital_twin/observation_frame.py'
      - '.github/workflows/fit_q20_beam_frame_residual_v1.yml'
  workflow_dispatch:

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/fit_q20_beam_frame_residual_v1.py
          pytest -q tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Fit residual on real BMG-derived arrays
        run: |
          python tools/fit_q20_beam_frame_residual_v1.py
      - name: Upload fit evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-beam-frame-residual-v1
          path: outputs/validation/q20_beam_frame_residual_v1/
          if-no-files-found: error
