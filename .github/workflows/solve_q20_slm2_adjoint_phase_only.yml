name: Solve q20 adjoint phase-only SLM2

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/solve_q20_slm2_adjoint_phase_only.py'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_aware_axicon_residual_candidate.json'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_domain_slm2_v2_candidate.json'
      - '.github/workflows/solve_q20_slm2_adjoint_phase_only.yml'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/solve_q20_slm2_adjoint_phase_only.py
          pytest -q tests/test_detector_response.py tests/test_vortex_explicit_system_extensions.py
      - name: Solve full phase-only SLM2 hologram and validate at 4096
        run: |
          python tools/solve_q20_slm2_adjoint_phase_only.py
      - name: Upload adjoint SLM2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-slm2-adjoint-phase-only
          path: outputs/validation/q20_slm2_adjoint_phase_only/
          if-no-files-found: error

