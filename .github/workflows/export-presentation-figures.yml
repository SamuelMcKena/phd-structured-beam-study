name: Export current presentation figures

on:
  push:
    branches:
      - agent/q20-observation-frame-fix

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical presentation assets
        run: |
          test -s outputs/figures/presentation_phase2i/01_computational_route.png
          test -s outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.png
          test -s outputs/figures/presentation_phase2i/08_V1_real_error_fingerprints.png
          test -s outputs/figures/presentation_phase2i/04_V1_axicon_decentre_fixed_lab.png
          test -s outputs/figures/presentation_phase2i/05_V1_nonideal_tip_fixed_lab.png
          test -s outputs/figures/presentation_phase2i/09_tip_avoidance_planning_proxy.png
          test -s outputs/figures/presentation_phase2i/10_synthetic_zstack_inverse_recovery.png
          test -s outputs/figures/presentation_phase2i/06_simulation_experiment_closure.png
      - name: Upload canonical presentation figures
        uses: actions/upload-artifact@v4
        with:
          name: current-presentation-figures
          if-no-files-found: error
          path: |
            outputs/figures/presentation_phase2i/01_computational_route.png
            outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.png
            outputs/figures/presentation_phase2i/08_V1_real_error_fingerprints.png
            outputs/figures/presentation_phase2i/04_V1_axicon_decentre_fixed_lab.png
            outputs/figures/presentation_phase2i/05_V1_nonideal_tip_fixed_lab.png
            outputs/figures/presentation_phase2i/09_tip_avoidance_planning_proxy.png
            outputs/figures/presentation_phase2i/10_synthetic_zstack_inverse_recovery.png
            outputs/figures/presentation_phase2i/06_simulation_experiment_closure.png
            docs/PRESENTATION_CURRENT.md
            docs/PRESENTATION_FIGURE_SELECTION.md
