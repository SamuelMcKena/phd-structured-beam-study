name: Audit q20 v3 beam-radius boundary

on:
  push:
    branches: [agent/q20-observation-frame-fix]
    paths:
      - 'tools/audit_q20_v3_beam_boundary.py'
      - '.github/workflows/audit_q20_v3_beam_boundary.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/fit_q20_detector_aware_model_v2.py tools/fit_q20_detector_aware_model_v3.py tools/audit_q20_v3_beam_boundary.py
          pytest -q tests/test_detector_response.py tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Run train-only boundary audit
        run: python tools/audit_q20_v3_beam_boundary.py
      - name: Upload boundary audit
        uses: actions/upload-artifact@v4
        with:
          name: q20-v3-beam-boundary-audit
          path: outputs/validation/q20_v3_beam_boundary_audit/
          if-no-files-found: error
