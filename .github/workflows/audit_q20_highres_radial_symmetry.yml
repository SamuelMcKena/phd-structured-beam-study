name: Audit q20 high-resolution radial symmetry

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/audit_q20_highres_radial_symmetry_v2.py'
      - '.github/workflows/audit_q20_highres_radial_symmetry.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/audit_q20_highres_radial_symmetry_v2.py
          pytest -q tests/test_detector_response.py tests/test_vortex_explicit_system_extensions.py
      - name: Render 2048 3072 4096 sampling audit
        run: |
          python tools/audit_q20_highres_radial_symmetry_v2.py
      - name: Upload radial-symmetry evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-highres-radial-symmetry
          path: outputs/validation/q20_highres_radial_symmetry/
          if-no-files-found: error
