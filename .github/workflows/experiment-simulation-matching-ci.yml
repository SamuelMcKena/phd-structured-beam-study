name: experiment-simulation-matching-ci

on:
  push:
    branches:
      - miao-error-vector-bessel-rebuild-2026-09-06
    paths:
      - 'vbb_study/inference/**'
      - 'tools/run_experiment_simulation_match.py'
      - 'tests/test_experiment_simulation_matching.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - 'vbb_study/digital_twin/vortex_beam_slm_errors.py'
      - 'vbb_study/digital_twin/vortex_explicit_4f.py'
      - 'vbb_study/digital_twin/vortex_wavefront_errors.py'
      - 'vbb_study/equations/propagation.py'
      - '.github/workflows/experiment-simulation-matching-ci.yml'
  workflow_dispatch:

jobs:
  inference-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile inference package and CLI
        run: |
          python -m compileall -q vbb_study/inference
          python -m compileall -q tools/run_experiment_simulation_match.py
      - name: Run inference contract tests
        run: pytest -q tests/test_experiment_simulation_matching.py
      - name: Canonical-route synthetic recovery gate
        run: |
          rm -rf outputs/experiment_simulation_match_ci
          python tools/run_experiment_simulation_match.py \
            --synthetic-known axicon_decentre_x=0.0005 \
            --case V1 \
            --grid-n 128 \
            --families axicon_decentre_x \
            --values axicon_decentre_x=0,0.0005,0.001 \
            --synthetic-z-mm 40 60 80 \
            --synthetic-gain 2.3 \
            --output-dir outputs/experiment_simulation_match_ci
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('outputs/experiment_simulation_match_ci')
          rows = list(csv.DictReader((root / 'candidate_ranking.csv').open()))
          assert rows[0]['family'] == 'axicon_decentre_x', rows[0]
          assert abs(float(rows[0]['value']) - 0.0005) < 1e-15, rows[0]
          assert float(rows[0]['score']) < 1e-8, rows[0]
          handoff = json.loads((root / 'miao_handoff.json').read_text())
          assert handoff['correction_map_ready'] is False
          assert handoff['status'] == 'ALIGNMENT_HYPOTHESIS_NOT_DIRECT_CONJUGATE_PHASE'
          PY
      - name: Upload synthetic inference evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-simulation-matching-synthetic-gate
          path: outputs/experiment_simulation_match_ci
          if-no-files-found: error
