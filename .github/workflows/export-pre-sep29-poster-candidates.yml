name: Export pre-Sep29 poster candidate figures

on:
  push:
    branches:
      - agent/q20-real-bmg-digital-twin-correction
    paths:
      - '.github/workflows/export-pre-sep29-poster-candidates.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected scientific figures
        run: |
          set -e
          files=(
            'outputs/figures/presentation_phase2i/01_computational_route.png'
            'outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.png'
            'outputs/figures/presentation_phase2i/08_V1_real_error_fingerprints.png'
            'outputs/figures/presentation_phase2i/04_V1_axicon_decentre_fixed_lab.png'
            'outputs/figures/presentation_phase2i/05_V1_nonideal_tip_fixed_lab.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/01_measured_BMG_contact_sheet.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/02_measured_XZ_YZ_fixed_coordinates.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/03_measured_miao_digital_twin_target_comparison.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/05_measured_beam_path.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/06_predicted_SLM2_correction_phase.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/08_error_reconstruction_backcheck.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/09_measured_corrected_ideal_profile_comparisons.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/measured_radial_profiles_and_fit.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/measured_vs_nominal_before_fitting.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/representative_measured_fit_corrected_ideal.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/signed_xz_yz_measured_corrected_ideal.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/measured_corrected_ideal_metrics_vs_z.png'
            'notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/measured_vs_predicted_corrected_3d.png'
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "missing: $f"; exit 1; }; done
      - name: Upload poster candidates
        uses: actions/upload-artifact@v4
        with:
          name: pre-sep29-poster-candidates
          if-no-files-found: error
          path: |
            outputs/figures/presentation_phase2i/01_computational_route.png
            outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.png
            outputs/figures/presentation_phase2i/08_V1_real_error_fingerprints.png
            outputs/figures/presentation_phase2i/04_V1_axicon_decentre_fixed_lab.png
            outputs/figures/presentation_phase2i/05_V1_nonideal_tip_fixed_lab.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/01_measured_BMG_contact_sheet.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/02_measured_XZ_YZ_fixed_coordinates.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/03_measured_miao_digital_twin_target_comparison.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/05_measured_beam_path.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/06_predicted_SLM2_correction_phase.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/08_error_reconstruction_backcheck.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/09_measured_corrected_ideal_profile_comparisons.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/measured_radial_profiles_and_fit.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/measured_vs_nominal_before_fitting.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/representative_measured_fit_corrected_ideal.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/signed_xz_yz_measured_corrected_ideal.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/measured_corrected_ideal_metrics_vs_z.png
            notebooks/experimental/axicon_aberration_correction/outputs/digital_twin_correction/miao_baseline/model_comparison/measured_vs_predicted_corrected_3d.png
