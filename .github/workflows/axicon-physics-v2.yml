name: Axicon physics v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vbb_study/digital_twin/vortex_axicon_tip_reference.py'
      - 'vbb_study/digital_twin/vortex_following_propagation.py'
      - 'vbb_study/digital_twin/vortex_morphology_tracking.py'
      - 'vbb_study/digital_twin/vortex_rotated_plane_baseband.py'
      - 'vbb_study/digital_twin/vortex_axicon_oblique_wave.py'
      - 'vbb_study/digital_twin/vortex_refractive_axicon.py'
      - 'vbb_study/digital_twin/vortex_refractive_axicon_wave.py'
      - 'tools/run_vortex_axicon_physics_suite.py'
      - 'tools/check_axicon_tip_benchmark.py'
      - 'tools/check_axicon_oblique_wave_benchmark_v2.py'
      - 'tests/test_vortex_axicon_tip_reference.py'
      - 'tests/test_vortex_following_axis.py'
      - 'tests/test_vortex_rotated_plane_baseband.py'
      - 'tests/test_vortex_refractive_axicon.py'
      - 'tests/test_vortex_refractive_axicon_wave.py'
      - '.github/workflows/axicon-physics-v2.yml'

concurrency:
  group: axicon-physics-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  unit-gates:
    name: Axicon v2 geometry/unit gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Focused unit tests
        run: >-
          python -m pytest -q
          tests/test_vortex_rotated_plane_carrier.py
          tests/test_vortex_axicon_oblique_reference.py
          tests/test_vortex_rotated_plane_baseband.py
          tests/test_vortex_axicon_tip_reference.py
          tests/test_vortex_following_axis.py
          tests/test_vortex_refractive_axicon.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axicon-v2-unit-gates
          path: outputs/validation
          retention-days: 14

  refractive-wave-reference:
    name: Two-surface refractive eikonal-wave gate
    needs: unit-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refractive eikonal-to-wave tests
        run: python -m pytest -q tests/test_vortex_refractive_axicon_wave.py

  tip-reference:
    name: Independent tip diffraction reference
    needs: unit-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compare radial Fresnel integral with 2-D ASM
        run: python tools/check_axicon_tip_benchmark.py --grid-n 1024 --output outputs/validation/axicon_tip_reference_benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axicon-tip-reference
          path: outputs/validation/axicon_tip_reference_benchmark.json
          retention-days: 14

  rejected-thin-tilt:
    name: Confirm thin rigid-tilt surrogate is rejected
    needs: unit-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run carrier-safe thin-axicon diagnostic
        id: thin
        continue-on-error: true
        run: python tools/check_axicon_oblique_wave_benchmark_v2.py --grid-n 768 --output outputs/validation/axicon_oblique_wave_benchmark_v2.json
      - name: Require explicit rejection until refractive solver replaces it
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('outputs/validation/axicon_oblique_wave_benchmark_v2.json')
          data = json.loads(path.read_text())
          assert data['hard_pass'] is False, 'thin rigid-tilt surrogate unexpectedly passed; review model/status rather than silently changing policy'
          failures = ' '.join(data.get('hard_failures', []))
          assert 'wave width anisotropy' in failures or 'effectively invariant' in failures
          print('Expected rejection confirmed:', failures)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rejected-thin-tilt-evidence
          path: outputs/validation/axicon_oblique_wave_benchmark_v2.json
          retention-days: 14

  physical-nontilt:
    name: Axicon v2 ${{ matrix.case }} / ${{ matrix.group }}
    needs: tip-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [B0, V1, V3]
        group: [alignment, tip, material]
        include:
          - group: alignment
            families: axicon_lateral_decentre_x axicon_lateral_decentre_y
          - group: tip
            families: axicon_round_tip_radius axicon_flat_tip_radius
          - group: material
            families: axicon_base_angle_scale axicon_index_scale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run N1536 validated non-tilt axicon figures
        shell: bash
        run: >-
          python tools/run_vortex_axicon_physics_suite.py
          --cases '${{ matrix.case }}'
          --families ${{ matrix.families }}
          --grid-n 1536
          --z-mm 60
          --output-root 'outputs/validation/axicon_v2/${{ matrix.case }}/${{ matrix.group }}'
          --figure-root 'outputs/figures/axicon_v2/${{ matrix.case }}/${{ matrix.group }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axicon-v2-${{ matrix.case }}-${{ matrix.group }}
          path: |
            outputs/validation/axicon_v2/${{ matrix.case }}/${{ matrix.group }}
            outputs/figures/axicon_v2/${{ matrix.case }}/${{ matrix.group }}
          retention-days: 14
