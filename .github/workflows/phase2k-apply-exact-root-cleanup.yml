name: Phase 2K apply exact Bessel-root cleanup

on:
  push:
    branches:
      - phase2k-mathematical-physics-output-audit

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Phase 2K exact-root cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2k-mathematical-physics-output-audit
          fetch-depth: 0

      - name: Replace remaining rounded J0 root in active code
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old!r}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no edit made to {path}')
              p.write_text(text, encoding='utf-8')

          edit('bessel_twin_core.py', [
              ('from vbb_study.design import (\n    axial_scan_values,', 'from vbb_study.design import (\n    J0_FIRST_ZERO,\n    axial_scan_values,'),
              ('"core_radius_2405_um": float(2.405 / design.kr_sample_m_inv / um),', '"core_radius_2405_um": float(J0_FIRST_ZERO / design.kr_sample_m_inv / um),  # legacy key; exact j_0,1 value'),
              ('"core_diameter_2405_um": float(2.0 * 2.405 / design.kr_sample_m_inv / um),', '"core_diameter_2405_um": float(2.0 * J0_FIRST_ZERO / design.kr_sample_m_inv / um),  # legacy key; exact j_0,1 value'),
              ('"equivalent_l0_first_zero_radius_um": float(design.equivalent_l0_first_zero_radius_m / um),', '"core_first_zero_radius_um": float(design.equivalent_l0_first_zero_radius_m / um),\n        "core_first_zero_diameter_um": float(design.equivalent_l0_first_zero_diameter_m / um),\n        "equivalent_l0_first_zero_radius_um": float(design.equivalent_l0_first_zero_radius_m / um),'),
              ('core_err = abs(refs["core_diameter_2405_um"] * um - config.target.target_core_diameter_m)', 'core_err = abs(refs["core_first_zero_diameter_um"] * um - config.target.target_core_diameter_m)'),
              ('"recovered_core_um": refs["core_diameter_2405_um"],', '"recovered_core_um": refs["core_first_zero_diameter_um"],'),
              ('abs(refs["core_diameter_2405_um"] - cfg.target.target_core_diameter_m / um) <= 0.1, refs["core_diameter_2405_um"]', 'abs(refs["core_first_zero_diameter_um"] - cfg.target.target_core_diameter_m / um) <= 0.1, refs["core_first_zero_diameter_um"]'),
          ])

          edit('tests/test_phase1_critical_physics_repairs.py', [
              ('from vbb_study.design import compute_design_from_config, default_config, objective_map_from_config', 'from vbb_study.design import J0_FIRST_ZERO, compute_design_from_config, default_config, objective_map_from_config'),
              ('kr_sample = 2.0 * 2.405 / cfg.target.target_core_diameter_m', 'kr_sample = 2.0 * J0_FIRST_ZERO / cfg.target.target_core_diameter_m'),
              ('def test_historical_inverse_design_default_is_numerically_unchanged() -> None:', 'def test_inverse_design_uses_exact_j0_first_zero_reference() -> None:'),
          ])

          edit('vbb_study/equations/objective_pupil.py', [
              ('import numpy as np\n', 'import numpy as np\nimport scipy.special as sp\n'),
              ('while preserving the legacy numerical value exactly.', 'while using the exact first zero of J_0 rather than the historical 2.405 rounding.'),
              ('kr_sample = 2.0 * 2.405 / D', 'kr_sample = 2.0 * float(sp.jn_zeros(0, 1)[0]) / D'),
          ])

          edit('vbb_study/vbb_polygonal.py', [
              ('from vbb_study.design import compute_design_from_config', 'from vbb_study.design import J0_FIRST_ZERO, compute_design_from_config'),
              ('target_core = 2.0 * 2.405 / max(float(config.kr_m_inv), BT_EPS)', 'target_core = 2.0 * J0_FIRST_ZERO / max(float(config.kr_m_inv), BT_EPS)'),
          ])

          edit('vbb_study/digital_twin/nathan_vector_hexagon.py', [
              ('from vbb_study.design import compute_design_from_targets, default_config', 'from vbb_study.design import J0_FIRST_ZERO, compute_design_from_targets, default_config'),
              ('target_core_diameter_m = float(2.0 * 2.405 / kr)', 'target_core_diameter_m = float(2.0 * J0_FIRST_ZERO / kr)'),
              ('target_core_diameter_m = float(2.0 * 2.405 / max(k_surface, EPS))', 'target_core_diameter_m = float(2.0 * J0_FIRST_ZERO / max(k_surface, EPS))'),
          ])

          edit('run_zernike_hex_bessel_checkpoint.py', [
              ('target_core = 2.0 * 2.405 / max(kr_sample, bt.EPS)', 'target_core = 2.0 * float(sp.jn_zeros(0, 1)[0]) / max(kr_sample, bt.EPS)'),
          ])

          edit('docs/00_theory.md', [
              ('r_core = 2.405 / k_r    (first zero of J_0)', 'r_core = j_{0,1} / k_r    (j_{0,1} = 2.404825557... is the first zero of J_0)'),
          ])
          edit('docs/01_conventions.md', [
              ('`2.405 / k_r`, the first zero of `J0(k_r r)`', '`j_{0,1} / k_r`, where `j_{0,1}=2.404825557...` is the first zero of `J0`'),
              ('`target_core_diameter_m = 2 * 2.405 / k_r` in the current compatibility mode', '`target_core_diameter_m = 2 * j_{0,1} / k_r` using the exact SciPy Bessel root'),
          ])
          edit('docs/60_nathan_mode1e_redesigned_downstream_confirmation.md', [
              ('target.target_core_diameter_m = 2 x 2.405 / k_r,surface', 'target.target_core_diameter_m = 2 x j_0,1 / k_r,surface'),
          ])
          PY

      - name: Prove no active rounded root remains in equations
        run: |
          ! grep -RIn --exclude-dir=.git --exclude='*.ipynb' \
            -E '(2\.0[[:space:]]*\*[[:space:]]*2\.405|2\.405[[:space:]]*/[[:space:]]*(k|kr|design)|=[[:space:]]*2\.405[[:space:]]*/)' \
            bessel_twin_core.py tests vbb_study run_zernike_hex_bessel_checkpoint.py

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bessel_twin_core.py tests/test_phase1_critical_physics_repairs.py \
            vbb_study/equations/objective_pupil.py vbb_study/vbb_polygonal.py \
            vbb_study/digital_twin/nathan_vector_hexagon.py run_zernike_hex_bessel_checkpoint.py \
            docs/00_theory.md docs/01_conventions.md docs/60_nathan_mode1e_redesigned_downstream_confirmation.md
          git commit -m 'Phase 2K exact-root cleanup: remove rounded j01 assumptions'
          git push origin HEAD:phase2k-mathematical-physics-output-audit
