name: SLM pixel registration audit

on:
  pull_request:
    paths:
      - 'vbb_study/digital_twin/slm_pixel_registration.py'
      - 'vbb_study/digital_twin/slm_registration_metrics.py'
      - 'vbb_study/digital_twin/vortex_beam_slm_errors.py'
      - 'vbb_study/slm_model.py'
      - 'tools/run_slm_pixel_registration_study.py'
      - 'tools/summarise_slm_pixel_registration.py'
      - 'tests/test_slm_pixel_registration.py'
      - 'docs/97_slm_pixel_registration_sensitivity.md'
      - '.github/workflows/slm-pixel-registration-audit.yml'
  workflow_dispatch:

concurrency:
  group: slm-pixel-registration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  focused-tests:
    name: Focused registration physics gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run dedicated test suite
        run: python -m pytest -q tests/test_slm_pixel_registration.py
      - name: Compile study modules
        run: >-
          python -m compileall -q
          vbb_study/digital_twin/slm_pixel_registration.py
          vbb_study/digital_twin/slm_registration_metrics.py
          tools/run_slm_pixel_registration_study.py
          tools/summarise_slm_pixel_registration.py
