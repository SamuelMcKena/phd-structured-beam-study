name: Optimize q20 symmetry-constrained SLM2 closure v3

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/optimize_q20_slm2_detector_closure_v3.py'
      - 'tools/optimize_q20_slm2_detector_closure_v2.py'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_aware_axicon_residual_candidate.json'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_domain_slm2_v2_candidate.json'
      - 'vbb_study/digital_twin/detector_response.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - '.github/workflows/optimize_q20_slm2_detector_closure_v3.yml'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/optimize_q20_slm2_detector_closure_v2.py tools/optimize_q20_slm2_detector_closure_v3.py
          pytest -q tests/test_detector_response.py tests/test_vortex_explicit_system_extensions.py
      - name: Optimize symmetry-constrained detector-domain SLM2 closure
        run: |
          python tools/optimize_q20_slm2_detector_closure_v3.py
      - name: Upload v3 closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-symmetry-constrained-slm2-closure-v3
          path: outputs/validation/q20_detector_domain_slm2_v3/
          if-no-files-found: error
