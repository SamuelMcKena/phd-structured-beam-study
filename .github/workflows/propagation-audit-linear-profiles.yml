name: Propagation audit and linear profiles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vbb_study/digital_twin/propagation_audit.py'
      - 'vbb_study/digital_twin/vortex_profile_evidence.py'
      - 'vbb_study/digital_twin/vortex_continuous_propagation.py'
      - 'vbb_study/digital_twin/phase2b_visual_cases.py'
      - 'tools/audit_phase2b_propagation.py'
      - 'tools/run_vortex_system_error_suite.py'
      - 'tools/run_vortex_declared_aberration_suite.py'
      - 'tests/test_propagation_audit.py'
      - 'tests/test_vortex_profile_evidence.py'
      - '.github/workflows/propagation-audit-linear-profiles.yml'

concurrency:
  group: propagation-audit-linear-profiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  unit-gates:
    name: Propagation/profile unit gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Focused tests
        run: >-
          python -m pytest -q
          tests/test_propagation_audit.py
          tests/test_vortex_profile_evidence.py
          tests/test_vortex_continuous_propagation.py
          tests/test_vortex_following_axis.py
          tests/test_vortex_rotated_plane_carrier.py
      - name: Compile audited modules
        run: >-
          python -m compileall -q
          vbb_study/digital_twin/propagation_audit.py
          vbb_study/digital_twin/vortex_profile_evidence.py
          tools/audit_phase2b_propagation.py
          tools/run_vortex_system_error_suite.py
          tools/run_vortex_declared_aberration_suite.py

  phase2b-audit:
    name: Phase2B scalar/vector padded-reference audit
    needs: unit-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit scalar N512 and vector N512 paths
        run: >-
          python tools/audit_phase2b_propagation.py
          --scalar-grid-n 512
          --vector-grid-n 512
          --output outputs/validation/propagation_audit/phase2b_N512.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2b-propagation-audit-N512
          path: outputs/validation/propagation_audit/phase2b_N512.json
          retention-days: 14

  phase2b-vector-production-audit:
    name: Phase2B vector N1024 padded-reference audit
    needs: unit-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit vector production sampling N1024
        run: >-
          python tools/audit_phase2b_propagation.py
          --scalar-grid-n 256
          --vector-grid-n 1024
          --output outputs/validation/propagation_audit/phase2b_vector_N1024.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2b-vector-propagation-audit-N1024
          path: outputs/validation/propagation_audit/phase2b_vector_N1024.json
          retention-days: 14

  system-smoke:
    name: System profile/propagation smoke
    needs: [unit-gates, phase2b-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Exercise steering, SLM, iris and lens families
        run: >-
          python tools/run_vortex_system_error_suite.py
          --cases V1
          --families
          beam_lateral_decentre_x
          slm1_hologram_offset_x
          fourf_iris_offset_x
          fourf_lens1_tilt_x
          --grid-n 512
          --z-mm 60
          --output-root outputs/validation/propagation_audit/system_smoke
          --figure-root outputs/figures/propagation_audit/system_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-profile-smoke
          path: |
            outputs/validation/propagation_audit/system_smoke
            outputs/figures/propagation_audit/system_smoke
          retention-days: 14

  aberration-smoke:
    name: Declared aberration profile smoke
    needs: unit-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Exercise common-scale 2D/profile output
        run: >-
          python tools/run_vortex_declared_aberration_suite.py
          --cases V1
          --planes input lens1
          --modes defocus coma_x
          --grid-n 512
          --output-root outputs/validation/propagation_audit/aberration_smoke
          --figure-root outputs/figures/propagation_audit/aberration_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aberration-profile-smoke
          path: |
            outputs/validation/propagation_audit/aberration_smoke
            outputs/figures/propagation_audit/aberration_smoke
          retention-days: 14

  system-full:
    name: N1536 ${{ matrix.case }} / ${{ matrix.group.name }} profiles
    needs: [system-smoke, phase2b-vector-production-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [B0, V1, V3]
        group:
          - name: beam
            families: 'beam_lateral_decentre_x beam_lateral_decentre_y beam_radius_scale beam_ellipticity beam_curvature_common beam_curvature_x beam_curvature_y'
          - name: slm_registration_stroke
            families: 'slm1_hologram_offset_x slm1_hologram_offset_y slm2_carrier_rotation slm2_carrier_scale_x slm_phase_stroke slm1_phase_stroke slm2_phase_stroke'
          - name: slm_fringing
            families: 'slm_fringing_sigma_x slm_fringing_sigma_y slm1_fringing_sigma_x slm2_fringing_sigma_x'
          - name: fourf_core
            families: 'fourf_iris_offset_x fourf_iris_offset_y fourf_iris_radius_scale fourf_lens1_despace fourf_lens2_despace fourf_lens1_focal_scale fourf_lens2_focal_scale'
          - name: fourf_alignment
            families: 'fourf_lens1_decentre_x fourf_lens1_decentre_y fourf_lens2_decentre_x fourf_lens2_decentre_y fourf_lens1_tilt_x fourf_lens1_tilt_y fourf_lens2_tilt_x fourf_lens2_tilt_y'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run full common-scale profile group
        shell: bash
        run: >-
          python tools/run_vortex_system_error_suite.py
          --cases '${{ matrix.case }}'
          --families ${{ matrix.group.families }}
          --grid-n 1536
          --z-mm 60
          --output-root 'outputs/validation/propagation_audit/full/${{ matrix.case }}/${{ matrix.group.name }}'
          --figure-root 'outputs/figures/propagation_audit/full/${{ matrix.case }}/${{ matrix.group.name }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propagation-profiles-${{ matrix.case }}-${{ matrix.group.name }}
          path: |
            outputs/validation/propagation_audit/full/${{ matrix.case }}/${{ matrix.group.name }}
            outputs/figures/propagation_audit/full/${{ matrix.case }}/${{ matrix.group.name }}
          retention-days: 14

  aberration-full:
    name: N1536 declared aberrations / ${{ matrix.case }}
    needs: aberration-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        case: [B0, V1, V3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run all named-plane Zernike profile sweeps
        run: >-
          python tools/run_vortex_declared_aberration_suite.py
          --cases '${{ matrix.case }}'
          --grid-n 1536
          --z-mm 60
          --output-root 'outputs/validation/propagation_audit/declared/${{ matrix.case }}'
          --figure-root 'outputs/figures/propagation_audit/declared/${{ matrix.case }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: declared-profile-sweeps-${{ matrix.case }}
          path: |
            outputs/validation/propagation_audit/declared/${{ matrix.case }}
            outputs/figures/propagation_audit/declared/${{ matrix.case }}
          retention-days: 14
