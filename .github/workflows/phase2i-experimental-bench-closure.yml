name: Phase 2I experimental bench closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vbb_study/experimental/**'
      - 'tools/check_phase2i_experimental_readiness.py'
      - 'tests/test_phase2i_experimental_*.py'
      - 'calibration/templates/phase2i_experimental_dataset_template.json'
      - '.github/workflows/phase2i-experimental-bench-closure.yml'

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  dataset-and-closure-contracts:
    name: Experimental provenance / closure contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Phase 2I focused tests
        run: >-
          python -m pytest -q
          tests/test_phase2i_experimental_dataset.py
          tests/test_phase2i_experimental_closure.py
          tests/test_canonical_evidence_conventions.py
      - name: Preserve Phase 2G camera/calibration primitives
        run: python -m pytest -q tests/test_phase2g_bench_calibrated_digital_twin.py
      - name: Compile Phase 2I code
        run: >-
          python -m compileall -q
          vbb_study/experimental
          tools/check_phase2i_experimental_readiness.py

  readiness-template:
    name: Machine-readable measurements-pending readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Evaluate unpopulated experimental dataset template
        run: >-
          python tools/check_phase2i_experimental_readiness.py
          --dataset calibration/templates/phase2i_experimental_dataset_template.json
          --output outputs/validation/phase2i/experimental_readiness_template.json
      - name: Upload readiness template result
        uses: actions/upload-artifact@v4
        with:
          name: phase2i-experimental-readiness
          path: outputs/validation/phase2i/experimental_readiness_template.json
          if-no-files-found: error
