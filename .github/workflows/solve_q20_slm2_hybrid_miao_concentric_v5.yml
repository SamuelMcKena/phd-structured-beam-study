name: Solve q20 hybrid Miao concentric correction v5

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/solve_q20_slm2_hybrid_miao_concentric_v5.py'
      - 'tools/crosscheck_q20_miao_initializer.py'
      - 'tools/benchmark_q20_miao_bessel_modal.py'
      - 'tools/fit_q20_detector_aware_model_v2.py'
      - 'tools/fit_q20_detector_aware_model_v3.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - 'vbb_study/digital_twin/detector_response.py'
      - '.github/workflows/solve_q20_slm2_hybrid_miao_concentric_v5.yml'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/fit_q20_detector_aware_model_v2.py tools/fit_q20_detector_aware_model_v3.py tools/benchmark_q20_miao_bessel_modal.py tools/crosscheck_q20_miao_initializer.py tools/solve_q20_slm2_hybrid_miao_concentric_v5.py
          pytest -q tests/test_detector_response.py tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Rebuild detector-aware source stack
        run: python tools/fit_q20_detector_aware_model_v2.py
      - name: Build independent Miao-style concentric benchmark
        run: python tools/benchmark_q20_miao_bessel_modal.py
      - name: Fit Miao-initialised bench-matched residual
        run: python tools/crosscheck_q20_miao_initializer.py
      - name: Solve concentricity-first phase-only SLM2 correction
        run: python tools/solve_q20_slm2_hybrid_miao_concentric_v5.py
      - name: Upload hybrid correction evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-slm2-hybrid-miao-concentric-v5
          path: outputs/validation/q20_slm2_hybrid_miao_concentric_v5/
          if-no-files-found: error

