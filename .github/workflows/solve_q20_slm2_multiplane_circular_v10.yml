name: Solve q20 multi-plane circular correction v10

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/solve_q20_slm2_multiplane_circular_v10.py'
      - 'tools/run_q20_slm2_multiplane_circular_v10.py'
      - 'vbb_study/digital_twin/concentricity_metrics.py'
      - 'tests/test_concentricity_metrics.py'
      - '.github/workflows/solve_q20_slm2_multiplane_circular_v10.yml'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/solve_q20_slm2_multiplane_circular_v10.py tools/run_q20_slm2_multiplane_circular_v10.py
          pytest -q tests/test_concentricity_metrics.py tests/test_detector_response.py tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Run multi-plane correction
        run: python tools/run_q20_slm2_multiplane_circular_v10.py
      - name: Upload v10 correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q20-slm2-multiplane-circular-v10
          path: outputs/validation/q20_slm2_multiplane_circular_v10/
          if-no-files-found: warn
      - name: Enforce multi-ring concentricity gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/validation/q20_slm2_multiplane_circular_v10/multiplane_v10_summary.json')
          if not p.exists(): raise SystemExit('v10 summary missing')
          a=json.loads(p.read_text())['acceptance']
          print(json.dumps(a,indent=2))
          if not a['passes_concentricity_gate']:
              raise SystemExit('v10 did not pass the multi-ring concentricity/topology gate')
          PY
