name: vortex-error-showcase-hires-v2

on:
  push:
    branches:
      - miao-error-vector-bessel-rebuild-2026-09-06
    paths:
      - 'tools/run_vortex_error_showcase_v2.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - 'vbb_study/digital_twin/vortex_following_propagation.py'
      - 'vbb_study/digital_twin/vortex_beam_slm_errors.py'
      - 'vbb_study/digital_twin/vortex_explicit_4f.py'
      - 'vbb_study/digital_twin/vortex_wavefront_errors.py'
      - 'vbb_study/equations/propagation.py'
      - '.github/workflows/vortex-error-showcase-v2.yml'
  workflow_dispatch:

jobs:
  hires-showcase-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile showcase runner
        run: python -m compileall -q tools/run_vortex_error_showcase_v2.py
      - name: Generate V3 1024 inferno showcase v2
        run: |
          python tools/run_vortex_error_showcase_v2.py \
            --case V3 \
            --grid-n 1024 \
            --z-mm 60 \
            --output-root outputs/error_showcase_hires_v2
      - name: Upload morphology-axis corrected outputs
        uses: actions/upload-artifact@v4
        with:
          name: vortex-error-showcase-hires-V3-v2
          path: outputs/error_showcase_hires_v2
          if-no-files-found: error
          compression-level: 6
