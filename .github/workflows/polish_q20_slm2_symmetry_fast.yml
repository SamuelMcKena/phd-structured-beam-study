name: Polish q20 SLM2 symmetry fast

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/polish_q20_slm2_symmetry_fast.py'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_aware_axicon_residual_candidate.json'
      - 'notebooks/experimental/axicon_aberration_correction/candidates/q20_detector_domain_slm2_v2_candidate.json'
      - '.github/workflows/polish_q20_slm2_symmetry_fast.yml'
  workflow_dispatch:

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/polish_q20_slm2_symmetry_fast.py
          pytest -q tests/test_detector_response.py tests/test_vortex_explicit_system_extensions.py
      - name: Run targeted symmetry polish
        run: |
          python tools/polish_q20_slm2_symmetry_fast.py
      - name: Upload symmetry-polish evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-slm2-symmetry-polish
          path: outputs/validation/q20_slm2_symmetry_polish/
          if-no-files-found: error

