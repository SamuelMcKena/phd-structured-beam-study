name: Benchmark q20 Miao Bessel modal retrieval

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/benchmark_q20_miao_bessel_modal.py'
      - '.github/workflows/benchmark_q20_miao_bessel_modal.yml'
      - 'tools/fit_q20_detector_aware_model_v2.py'
      - 'vbb_study/digital_twin/detector_response.py'
      - 'vbb_study/digital_twin/observation_frame.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - 'vbb_study/digital_twin/vortex_continuous_propagation.py'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/fit_q20_detector_aware_model_v2.py tools/benchmark_q20_miao_bessel_modal.py
          pytest -q tests/test_detector_response.py tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Rebuild detector-aware model v2 evidence
        run: python tools/fit_q20_detector_aware_model_v2.py
      - name: Run held-out Miao-style analytic benchmark
        run: python tools/benchmark_q20_miao_bessel_modal.py
      - name: Upload Miao benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-miao-bessel-modal-benchmark
          path: outputs/validation/q20_miao_bessel_modal_benchmark/
          if-no-files-found: error
