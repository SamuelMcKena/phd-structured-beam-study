name: Fit q20 detector-aware model v3

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/fit_q20_detector_aware_model_v3.py'
      - '.github/workflows/fit_q20_detector_aware_model_v3.yml'
      - 'tools/fit_q20_detector_aware_model_v2.py'
      - 'vbb_study/digital_twin/detector_response.py'
      - 'vbb_study/digital_twin/observation_frame.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - 'vbb_study/digital_twin/vortex_continuous_propagation.py'
  workflow_dispatch:

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/fit_q20_detector_aware_model_v2.py tools/fit_q20_detector_aware_model_v3.py
          pytest -q tests/test_detector_response.py tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Fit physical nuisance parameters then q20 residual
        run: |
          python tools/fit_q20_detector_aware_model_v3.py
      - name: Upload model-v3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-detector-aware-model-v3
          path: outputs/validation/q20_detector_aware_model_v3/
          if-no-files-found: error
