name: Export exact presentation poster assets

on:
  push:
    branches:
      - agent/q20-real-bmg-digital-twin-correction
    paths:
      - '.github/workflows/export-exact-presentation-poster-assets.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical presentation assets
        run: |
          set -e
          files=(
            'outputs/figures/presentation_phase2i/01_computational_route.png'
            'outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.png'
            'outputs/figures/presentation_phase2i/08_V1_real_error_fingerprints.png'
            'outputs/figures/presentation_phase2i/04_V1_axicon_decentre_fixed_lab.png'
            'outputs/figures/presentation_phase2i/05_V1_nonideal_tip_fixed_lab.png'
            'outputs/figures/presentation_phase2i/09_tip_avoidance_planning_proxy.png'
            'outputs/figures/presentation_phase2i/10_synthetic_zstack_inverse_recovery.png'
            'outputs/figures/presentation_phase2i/06_simulation_experiment_closure.png'
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "missing: $f"; exit 1; }; done
      - name: Upload exact presentation assets
        uses: actions/upload-artifact@v4
        with:
          name: exact-presentation-poster-assets
          if-no-files-found: error
          path: |
            outputs/figures/presentation_phase2i/01_computational_route.png
            outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.png
            outputs/figures/presentation_phase2i/08_V1_real_error_fingerprints.png
            outputs/figures/presentation_phase2i/04_V1_axicon_decentre_fixed_lab.png
            outputs/figures/presentation_phase2i/05_V1_nonideal_tip_fixed_lab.png
            outputs/figures/presentation_phase2i/09_tip_avoidance_planning_proxy.png
            outputs/figures/presentation_phase2i/10_synthetic_zstack_inverse_recovery.png
            outputs/figures/presentation_phase2i/06_simulation_experiment_closure.png
