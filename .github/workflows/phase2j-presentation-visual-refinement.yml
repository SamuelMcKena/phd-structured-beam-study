name: Phase 2J presentation visual refinement

on:
  workflow_dispatch:
  push:
    branches:
      - phase2j-presentation-visual-refinement
    paths:
      - 'tools/build_phase2j_ideal_beam_profile_figure.py'
      - '.github/workflows/phase2j-presentation-visual-refinement.yml'

permissions:
  contents: write

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  render-phase2j-ideal-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Render high-resolution B0/V1/V3 figure
        run: >-
          python tools/build_phase2j_ideal_beam_profile_figure.py
          --grid-n 1536
          --output-dir outputs/figures/presentation_phase2j
      - name: Verify figure and provenance note
        run: |
          test -s outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.png
          test -s outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.txt
          cat outputs/figures/presentation_phase2j/02_beam_profile_shaping_B0_V1_V3_inferno_tight.txt
      - name: Commit generated Phase 2J figure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/figures/presentation_phase2j
          if git diff --cached --quiet; then
            echo 'Phase 2J output unchanged.'
          else
            git commit -m 'Generate Phase 2J high-resolution ideal beam figure'
            git pull --rebase origin phase2j-presentation-visual-refinement
            git push origin HEAD:phase2j-presentation-visual-refinement
          fi
