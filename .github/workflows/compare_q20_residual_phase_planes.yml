name: Compare q20 residual phase planes

on:
  push:
    branches:
      - agent/q20-observation-frame-fix
    paths:
      - 'tools/compare_q20_residual_phase_planes.py'
      - 'vbb_study/digital_twin/observation_frame.py'
      - 'vbb_study/digital_twin/residual_phase_fit.py'
      - 'vbb_study/digital_twin/vortex_system_route.py'
      - '.github/workflows/compare_q20_residual_phase_planes.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest
      - name: Compile and focused tests
        run: |
          python -m compileall -q vbb_study tools/compare_q20_residual_phase_planes.py
          pytest -q tests/test_observation_frame.py tests/test_vortex_explicit_system_extensions.py
      - name: Compare residual phase planes on real BMG-derived arrays
        run: |
          python tools/compare_q20_residual_phase_planes.py
      - name: Upload phase-plane evidence
        uses: actions/upload-artifact@v4
        with:
          name: q20-residual-phase-plane-comparison
          path: outputs/validation/q20_phase_plane_comparison/
          if-no-files-found: error
