name: Phase 2H canonical figure evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vbb_study/reporting/evidence_conventions.py'
      - 'tools/render_phase2h_canonical_evidence.py'
      - 'tools/render_phase2h_highres_analyzer_atlas.py'
      - 'tests/test_canonical_evidence_conventions.py'
      - 'docs/CANONICAL_FIGURE_EVIDENCE_SPEC.md'
      - '.github/workflows/phase2h-canonical-evidence.yml'

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'

jobs:
  evidence-contract:
    name: Canonical evidence convention tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test evidence contract
        run: python -m pytest -q tests/test_canonical_evidence_conventions.py
      - name: Compile evidence code
        run: >-
          python -m compileall -q
          vbb_study/reporting/evidence_conventions.py
          tools/render_phase2h_canonical_evidence.py
          tools/render_phase2h_highres_analyzer_atlas.py

  canonical-six-sector-pair:
    name: Canonical longitudinal + zref evidence pair
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Render canonical Phase 2H six-sector evidence
        run: >-
          python tools/render_phase2h_canonical_evidence.py
          --output-dir outputs/validation/phase2h/canonical_evidence
      - name: Upload canonical Phase 2H evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2h-canonical-evidence-pair
          path: outputs/validation/phase2h/canonical_evidence
          if-no-files-found: error

  highres-analyzer-atlas:
    name: Recomputed high-resolution analyzer spots
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Render high-resolution analyzer atlas
        run: >-
          python tools/render_phase2h_highres_analyzer_atlas.py
          --output-dir outputs/validation/phase2h/highres_analyzer_atlas
      - name: Upload high-resolution analyzer atlas
        uses: actions/upload-artifact@v4
        with:
          name: phase2h-highres-analyzer-atlas
          path: outputs/validation/phase2h/highres_analyzer_atlas
          if-no-files-found: error
